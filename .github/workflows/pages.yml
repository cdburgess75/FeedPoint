name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp feedpoint.html _site/index.html
          cp docs/apple-touch-icon.png _site/apple-touch-icon.png
          cp docs/icon-512.png _site/icon-512.png
          cp docs/manifest.webmanifest _site/manifest.webmanifest
          cp docs/sw.js _site/sw.js
          cp docs/favicon.ico _site/favicon.ico
          cp docs/favicon-16.png _site/favicon-16.png
          cp docs/favicon-32.png _site/favicon-32.png
          cp docs/mask-icon.svg _site/mask-icon.svg
          cp docs/apple-touch-icon.png _site/touch-icon-180-v9.png
          cp docs/icon-512.png _site/icon-512-v9.png
          cp docs/touch-icon-180-v10.png _site/touch-icon-180-v10.png
          cp docs/icon-512-v10.png _site/icon-512-v10.png
          cp docs/touch-icon-180-v11.png _site/touch-icon-180-v11.png
          cp docs/icon-512-v11.png _site/icon-512-v11.png
          cp docs/touch-icon-180-v12.png _site/touch-icon-180-v12.png
          cp docs/icon-512-v12.png _site/icon-512-v12.png
          cp docs/touch-icon-180-v13.png _site/touch-icon-180-v13.png
          cp docs/icon-512-v13.png _site/icon-512-v13.png
          cp docs/touch-icon-180-v14.png _site/touch-icon-180-v14.png
          cp docs/icon-512-v14.png _site/icon-512-v14.png
      - name: Stamp build version
        run: |
          VER=$(grep -o 'APP_VERSION="[^"]*"' _site/index.html | head -1 | cut -d'"' -f2)
          echo "Build version: $VER"
          # Stamping sw.js makes every release ship a different worker —
          # that's what triggers the in-app "Update now" banner.
          sed -i "s/__BUILD_VERSION__/${VER}/g" _site/sw.js
          grep -q "$VER" _site/sw.js
      - name: Verify icons
        run: |
          set -e
          for f in touch-icon-180-v14.png icon-512-v14.png touch-icon-180-v13.png icon-512-v13.png touch-icon-180-v12.png icon-512-v12.png touch-icon-180-v11.png icon-512-v11.png touch-icon-180-v10.png icon-512-v10.png apple-touch-icon.png manifest.webmanifest; do
            test -s "_site/$f" || { echo "MISSING OR EMPTY: $f"; exit 1; }
          done
          file _site/touch-icon-180-v14.png _site/icon-512-v14.png
          sha256sum _site/touch-icon-180-v14.png _site/icon-512-v14.png _site/manifest.webmanifest
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
